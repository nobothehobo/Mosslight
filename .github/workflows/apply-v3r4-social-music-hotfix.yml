name: Apply V3R4 social and music hotfix

on:
  push:
    branches:
      - development
    paths:
      - "tools/apply-v3r4-social-music-hotfix.py"
      - ".github/workflows/apply-v3r4-social-music-hotfix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Apply V3R4 hotfix
        run: python tools/apply-v3r4-social-music-hotfix.py

      - name: Validate JavaScript syntax
        run: |
          node --check working/assets/mosslight-v3-readable.js
          node --check source/legacy/mosslight-v3-runtime.js

      - name: Verify hotfix markers
        run: |
          grep -q "brows = \[\]" working/assets/mosslight-v3-readable.js
          grep -q "r.rotation.z = Mi(r.rotation.z, 2.38" working/assets/mosslight-v3-readable.js
          grep -q "musicPhrase" working/assets/mosslight-v3-readable.js
          grep -q "v=3.4" working/index.html
          grep -q "V3R4 development hotfix" CHANGELOG.md

      - name: Commit hotfix
        run: |
          git config user.name "Mosslight Development Bot"
          git config user.email "actions@users.noreply.github.com"
          git add CHANGELOG.md source/legacy/mosslight-v3-runtime.js working/assets/mosslight-v3-readable.js working/index.html
          if git diff --cached --quiet; then
            echo "V3R4 hotfix already applied."
            exit 0
          fi
          git commit -m "Fix NPC social animation and music variation"
          git push origin development
