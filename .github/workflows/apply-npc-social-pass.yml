name: Apply NPC social development pass

on:
  push:
    branches:
      - development
    paths:
      - "tools/apply-npc-social-pass.py"
      - ".github/workflows/apply-npc-social-pass.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Apply social pass
        run: python tools/apply-npc-social-pass.py

      - name: Validate JavaScript syntax
        run: |
          node --check working/assets/mosslight-v3-readable.js
          node --check source/legacy/mosslight-v3-runtime.js

      - name: Verify social pass markers
        run: |
          grep -q "const ML_SOCIAL" working/assets/mosslight-v3-readable.js
          grep -q "socialPose" working/assets/mosslight-v3-readable.js
          grep -q "npc-social-bubble" working/assets/mosslight-v3.css
          grep -q "V3R2 development" CHANGELOG.md

      - name: Commit development changes
        run: |
          git config user.name "Mosslight Development Bot"
          git config user.email "actions@users.noreply.github.com"
          git add CHANGELOG.md source/data/dialogue.json source/data/npc-social-profiles.json source/legacy/mosslight-v3-runtime.js source/legacy/mosslight-v3.css working/assets/mosslight-v3-readable.js working/assets/mosslight-v3.css
          if git diff --cached --quiet; then
            echo "Social pass already applied."
            exit 0
          fi
          git commit -m "Implement NPC social greeting pass"
          git push origin development
