name: Apply V3R5.1 fullscreen visibility hotfix

on:
  push:
    branches:
      - development
    paths:
      - "tools/apply-v3r51-fullscreen-visibility.py"
      - ".github/workflows/apply-v3r51-fullscreen-visibility.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Apply hotfix
        run: python tools/apply-v3r51-fullscreen-visibility.py

      - name: Validate runtime
        run: |
          node --check working/assets/mosslight-v3-readable.js
          grep -q 'id="title-fullscreen"' working/assets/mosslight-v3-readable.js
          grep -q 'v=3.51' working/index.html

      - name: Commit hotfix
        run: |
          git config user.name "Mosslight Development Bot"
          git config user.email "actions@users.noreply.github.com"
          git add CHANGELOG.md source/legacy/mosslight-v3-runtime.js source/legacy/mosslight-v3.css working/assets/mosslight-v3-readable.js working/assets/mosslight-v3.css working/index.html
          git commit -m "Make fullscreen control visible on title screen" || exit 0
          git push origin development
