name: Import Mosslight recovery snapshot

on:
  push:
    paths:
      - "archives/Mosslight_V3R1_Reconstructed_Source.zip"
      - ".github/workflows/import-recovery.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack recovery archive
        shell: bash
        run: |
          set -euo pipefail
          archive="archives/Mosslight_V3R1_Reconstructed_Source.zip"
          test -f "$archive"
          sha256sum "$archive"
          mkdir -p /tmp/mosslight-import
          unzip -q "$archive" -d /tmp/mosslight-import

      - name: Import exact recovered source tree
        shell: bash
        run: |
          set -euo pipefail
          src="/tmp/mosslight-import/Mosslight_V3R1_Reconstructed_Source"
          test -d "$src"
          rsync -a --exclude='.github/workflows/deploy-pages.yml' "$src"/ ./

      - name: Verify critical recovery files
        shell: bash
        run: |
          set -euo pipefail
          test -f baseline/assets/index-Cf9eUsqG.js
          test -f baseline/assets/index-DeL8tS3c.css
          test -f source/legacy/mosslight-v3-runtime.js
          test -f working/assets/mosslight-v3-readable.js
          test -f source/data/npcs.json
          test -f source/data/dialogue.json
          test -f RECOVERY_MANIFEST.json
          echo "Recovery source tree verified."

      - name: Commit imported recovery baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Mosslight Recovery Bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md CHANGELOG.md RECOVERY_MANIFEST.json package.json tsconfig.json baseline working source docs
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Import exact Mosslight V3R1 reconstructed baseline [skip ci]"
          git push
