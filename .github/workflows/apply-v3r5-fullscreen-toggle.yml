name: Apply V3R5 fullscreen toggle

on:
  push:
    branches:
      - development
    paths:
      - "tools/apply-v3r5-fullscreen-toggle.py"
      - ".github/workflows/apply-v3r5-fullscreen-toggle.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Apply V3R5 fullscreen toggle
        run: python tools/apply-v3r5-fullscreen-toggle.py

      - name: Validate JavaScript syntax
        run: |
          node --check working/assets/mosslight-v3-readable.js
          node --check source/legacy/mosslight-v3-runtime.js

      - name: Verify fullscreen markers
        run: |
          grep -q 'id="fullscreen-button"' working/assets/mosslight-v3-readable.js
          grep -q "fullscreenActive()" working/assets/mosslight-v3-readable.js
          grep -q "V3R5 fullscreen toggle" working/assets/mosslight-v3.css
          grep -q "v=3.5" working/index.html

      - name: Commit fullscreen toggle
        run: |
          git config user.name "Mosslight Development Bot"
          git config user.email "actions@users.noreply.github.com"
          git add CHANGELOG.md source/legacy/mosslight-v3-runtime.js source/legacy/mosslight-v3.css working/assets/mosslight-v3-readable.js working/assets/mosslight-v3.css working/index.html
          if git diff --cached --quiet; then
            echo "V3R5 fullscreen toggle already applied."
            exit 0
          fi
          git commit -m "Add fullscreen toggle"
          git push origin development
