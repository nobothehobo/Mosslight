name: Apply V3R6 character cute pass

on:
  push:
    branches:
      - development
    paths:
      - "tools/apply-v3r6-character-cute-pass.py"
      - ".github/workflows/apply-v3r6-character-cute-pass.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Apply character cute pass
        run: python tools/apply-v3r6-character-cute-pass.py

      - name: Validate runtime
        run: |
          node --check working/assets/mosslight-v3-readable.js
          node --check source/legacy/mosslight-v3-runtime.js
          grep -q 'V3R6 development — Character Cute Pass' CHANGELOG.md
          grep -q 'v=3.60' working/index.html
          grep -q 'R(this.head, "round", t.skin, 0, .15, 0, .48, .5, .405)' working/assets/mosslight-v3-readable.js

      - name: Commit character pass
        run: |
          git config user.name "Mosslight Development Bot"
          git config user.email "actions@users.noreply.github.com"
          git add CHANGELOG.md source/legacy/mosslight-v3-runtime.js working/assets/mosslight-v3-readable.js working/index.html
          git commit -m "Implement V3R6 character cute pass" || exit 0
          git push origin development
