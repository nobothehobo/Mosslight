name: Apply V3R3 visual and music pass

on:
  push:
    branches:
      - development
    paths:
      - "tools/apply-v3r3-visual-music-pass.py"
      - ".github/workflows/apply-v3r3-visual-music-pass.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Apply V3R3 pass
        run: python tools/apply-v3r3-visual-music-pass.py

      - name: Validate JavaScript syntax
        run: |
          node --check working/assets/mosslight-v3-readable.js
          node --check source/legacy/mosslight-v3-runtime.js

      - name: Verify V3R3 markers
        run: |
          grep -q "musicPhrase" working/assets/mosslight-v3-readable.js
          grep -q "new On(1, 10, 7)" working/assets/mosslight-v3-readable.js
          grep -q "V3R3 development" CHANGELOG.md

      - name: Commit development changes
        run: |
          git config user.name "Mosslight Development Bot"
          git config user.email "actions@users.noreply.github.com"
          git add CHANGELOG.md source/legacy/mosslight-v3-runtime.js working/assets/mosslight-v3-readable.js
          if git diff --cached --quiet; then
            echo "V3R3 pass already applied."
            exit 0
          fi
          git commit -m "Implement V3R3 visual and music foundation"
          git push origin development
