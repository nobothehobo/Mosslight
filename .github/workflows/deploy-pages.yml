name: Deploy Mosslight stable + development preview

on:
  push:
    branches:
      - main
      - development
    paths:
      - "working/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "mosslight-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout stable baseline
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable-src

      - name: Checkout development preview
        uses: actions/checkout@v4
        with:
          ref: development
          path: dev-src

      - name: Assemble stable and preview site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/dev
          cp -a stable-src/working/. site/
          cp -a dev-src/working/. site/dev/
          test -f site/index.html
          test -f site/assets/mosslight-v3-readable.js
          test -f site/dev/index.html
          test -f site/dev/assets/mosslight-v3-readable.js
          echo "Stable root and development preview verified."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Mosslight site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
